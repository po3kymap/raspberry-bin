services:
  api:
    container_name: raspberry-bin-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Not published to the internet: only reachable through Caddy
    expose:
      - "8080"
    environment:
      # The ML container, found by its service name on the "ml" network
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ml:5000}
      FIREBASE_CREDENTIALS: /app/serviceAccountKey.json
      DEVICE_API_KEY: ${DEVICE_API_KEY:?Set DEVICE_API_KEY in .env}
      # Docker's internal networks, where Caddy's requests come from
      TRUSTED_PROXIES: 172.16.0.0/12
    networks:
      - web
      - ml
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  ml:
    container_name: raspberry-bin-ml
    build:
      # Repository root, because the code imports the "ml" package
      context: ..
      dockerfile: ml/Dockerfile
    restart: unless-stopped
    # No ports and only on the internal "ml" network: reachable by the API only,
    # not by Caddy or the internet, and it cannot connect out to the internet either.
    expose:
      - "5000"
    networks:
      - ml
    environment:
      CONFIDENCE_THRESHOLD: "0.80"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  caddy:
    container_name: raspberry-bin-caddy
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      # Previous address that redirects to DOMAIN; a .localhost name means "none"
      OLD_DOMAIN: ${OLD_DOMAIN:-old.localhost}
    networks:
      - web
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Built web app (npm run build in frontend/)
      - ../frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

networks:
  # Caddy <-> API; also gives the API internet access for Firebase
  web: # API <-> ML only; "internal" means no route to the outside world

  ml:
    internal: true

volumes:
  caddy_data:
  caddy_config:
